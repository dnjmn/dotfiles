# ============================================
# Tmux Status Line Configuration
# Theme: Gruvbox Dark | Developer Focused
# ============================================

# --------------------------------------------
# Gruvbox Colors
# --------------------------------------------
# bg:       #282828    fg:       #ebdbb2
# bg1:      #3c3836    fg4:      #a89984
# bg2:      #504945    red:      #fb4934
# green:    #b8bb26    yellow:   #fabd2f
# blue:     #83a598    purple:   #d3869b
# aqua:     #8ec07c    orange:   #fe8019

# --------------------------------------------
# General
# --------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-left-length 80
set -g status-right-length 60
set -g status-style "bg=#282828,fg=#ebdbb2"

# --------------------------------------------
# Left: Empty (windows only)
# --------------------------------------------
set -g status-left ""

# --------------------------------------------
# Right: Git | Battery | Time
# --------------------------------------------
# git branch + dirty flag, battery, clock. One git process replaces the previous
# four-call chain (rev-parse + branch + diff + diff --cached); measured 56 ms vs
# 116 ms. `git -C` replaces the `cd` subshell.
set -g status-right "\
#[fg=#504945,bg=#282828]\
#[fg=#b8bb26,bg=#504945] #(git -C '#{pane_current_path}' status --porcelain=v2 --branch 2>/dev/null | awk '/^# branch.head/{b=$3} /^[12u?]/{d=\"*\"} END{if(b!=\"\")printf \"%s%s\",b,d; else printf \"󰊢\"}') \
#[fg=#3c3836,bg=#504945]\
#[fg=#fabd2f,bg=#3c3836] #(pmset -g batt | awk 'match($0,/[0-9]+%/){print substr($0,RSTART,RLENGTH)}') \
#[fg=#b8bb26,bg=#3c3836]\
#[fg=#282828,bg=#b8bb26,bold]  %H:%M "

# --------------------------------------------
# Window Status
# --------------------------------------------
set -g window-status-format "#[fg=#a89984,bg=#282828] #I:#W "
set -g window-status-current-format "#[fg=#282828,bg=#83a598,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#fabd2f,bold"
set -g window-status-bell-style "fg=#fb4934,bold"

# --------------------------------------------
# Mode & Messages
# --------------------------------------------
set -g mode-style "bg=#fabd2f,fg=#282828,bold"
set -g message-style "bg=#282828,fg=#fabd2f,bold"
set -g message-command-style "bg=#504945,fg=#ebdbb2"

# --------------------------------------------
# Clock
# --------------------------------------------
setw -g clock-mode-colour "#b8bb26"
setw -g clock-mode-style 24
