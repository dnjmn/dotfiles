# ============================================
# Tmux Status Line Configuration
# Theme: Gruvbox Dark | Developer Focused
# ============================================

# --------------------------------------------
# Gruvbox Colors
# --------------------------------------------
# bg:       #282828    fg:       #ebdbb2
# bg1:      #3c3836    fg4:      #a89984
# bg2:      #504945    red:      #fb4934
# green:    #b8bb26    yellow:   #fabd2f
# blue:     #83a598    purple:   #d3869b
# aqua:     #8ec07c    orange:   #fe8019

# --------------------------------------------
# General
# --------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 2

set -g status-left-length 80
set -g status-right-length 200
set -g status-style "bg=#282828,fg=#ebdbb2"

# --------------------------------------------
# Left: Empty (windows only)
# --------------------------------------------
set -g status-left ""

# --------------------------------------------
# Right: Git | K8s | Docker | Stats | Time
# --------------------------------------------
# Git: branch + status
# K8s: current context
# Docker: running container count
# Stats: CPU + Memory + Battery
# Time: HH:MM

set -g status-right "\
#[fg=#504945,bg=#282828]\
#[fg=#b8bb26,bg=#504945] #(cd #{pane_current_path}; git rev-parse --is-inside-work-tree >/dev/null 2>&1 && echo \" $(git branch --show-current 2>/dev/null)$(git diff --quiet 2>/dev/null || echo '*')$(git diff --cached --quiet 2>/dev/null || echo '+')\" || echo '󰊢') \
#[fg=#3c3836,bg=#504945]\
#[fg=#83a598,bg=#3c3836] #(kubectl config current-context 2>/dev/null | cut -d/ -f2 | cut -c1-12 || echo '○') \
#[fg=#504945,bg=#3c3836]\
#[fg=#d3869b,bg=#504945] #(docker ps -q 2>/dev/null | wc -l | tr -d ' ') \
#[fg=#3c3836,bg=#504945]\
#[fg=#fe8019,bg=#3c3836] #(top -l 1 -n 0 2>/dev/null | awk '/CPU usage/ {print $3}' || echo '?') \
#[fg=#504945,bg=#3c3836]\
#[fg=#8ec07c,bg=#504945] #(memory_pressure 2>/dev/null | awk '/percentage/ {print $5}' || echo '?') \
#[fg=#3c3836,bg=#504945]\
#[fg=#fabd2f,bg=#3c3836] #(pmset -g batt 2>/dev/null | grep -Eo '[0-9]+%%' | head -1 || echo '⚡') \
#[fg=#b8bb26,bg=#3c3836]\
#[fg=#282828,bg=#b8bb26,bold]  %H:%M "

# --------------------------------------------
# Window Status
# --------------------------------------------
set -g window-status-format "#[fg=#a89984,bg=#282828] #I:#W "
set -g window-status-current-format "#[fg=#282828,bg=#83a598,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#fabd2f,bold"
set -g window-status-bell-style "fg=#fb4934,bold"

# --------------------------------------------
# Mode & Messages
# --------------------------------------------
set -g mode-style "bg=#fabd2f,fg=#282828,bold"
set -g message-style "bg=#282828,fg=#fabd2f,bold"
set -g message-command-style "bg=#504945,fg=#ebdbb2"

# --------------------------------------------
# Clock
# --------------------------------------------
setw -g clock-mode-colour "#b8bb26"
setw -g clock-mode-style 24
